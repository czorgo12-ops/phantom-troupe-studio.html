    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
  }
  a { text-decoration: none; }

  .logo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; }
  .logo-row img { width: 28px; height: 28px; border-radius: 6px; background: #fff; object-fit: contain; padding: 3px; }
  .logo-row span {
    font-weight: 800; font-size: 13px;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .mascot {
    width: 200px; height: 200px; border-radius: 20px; overflow: hidden;
    background: var(--bg-elev); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    animation: float 3.5s ease-in-out infinite;
  }
  .mascot img { width: 100%; height: 100%; object-fit: cover; }
  .mascot .placeholder { font-size: 48px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .error-code {
    font-size: 72px; font-weight: 800; line-height: 1;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 10px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  p { font-size: 14px; color: var(--text-secondary); max-width: 320px; margin: 0 0 28px; line-height: 1.6; }

  .btn-home {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 30px;
    font-size: 13px; font-weight: 700; color: #fff; background: var(--gradient);
    transition: transform 0.15s ease;
  }
  .btn-home:active { transform: scale(0.96); }
  .btn-home svg { width: 14px; height: 14px; }

  footer { margin-top: 40px; font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
